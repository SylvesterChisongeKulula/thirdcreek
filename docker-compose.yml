services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      DATABASE_URL: file:.data/thirdcreek.db
      SESSION_PASSWORD: ${SESSION_PASSWORD:?SESSION_PASSWORD must be set (32+ chars) for production}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      OWNER_DEV_PASSWORD: ${OWNER_DEV_PASSWORD:-}
      STAFF_DEV_PASSWORD: ${STAFF_DEV_PASSWORD:-}
    volumes:
      - db-data:/app/.data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
